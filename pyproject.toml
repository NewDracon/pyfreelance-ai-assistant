[tool.poetry]
name = "freelance-assistant"
version = "0.1.0"
description = "AI-анализатор заказов с фриланс-бирж (RAG)"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "freelance_assistant", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
chromadb = "^0.4.0"
openai = "^1.0.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
alembic = "^1.13.0"                # для миграций

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
ruff = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"